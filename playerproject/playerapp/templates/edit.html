{% extends "base.html" %}

{% block title %}
<title>Add</title>
{% endblock title %}

{% block body %}
<h1>Edit Player</h1>
<form method="post">
    {% csrf_token %}
    Name: <input type="text" name='player_name' value="{{play.name}}"><br><br>
    Test Innings: <input type="number" name="test_innings" value="{{play.test_innings}}"><br><br>
    Runs: <input type="number" name="runs" value="{{play.runs}}"><br><br>
    <input type="submit" value="Edit">
</form>
{% endblock body %}
